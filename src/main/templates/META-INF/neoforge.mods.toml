modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/lord-navy-crypto/SWARM-MOBS/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/lord-navy-crypto/SWARM-MOBS"
authors="lord-navy-crypto"
description='''
Swarm Mobs experiments with local sensing, shared target memory, role assignment,
formation-aware movement, and later fault-tolerant communication for Minecraft mobs.

The first development milestone focuses on algorithmic zombie swarm cooperation.
External AI/LLM control is deliberately disabled by default and reserved for later work.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
