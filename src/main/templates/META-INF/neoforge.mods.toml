modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/lord-navy-crypto/SWARM-MOBS/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/lord-navy-crypto/SWARM-MOBS"
authors="lord-navy-crypto"
description='''
Swarm Mobs implements heterogeneous local swarm intelligence for Zombies, Skeletons,
Spiders, and Creepers, including shared target memory, dynamic division of labor,
formation-aware movement, bounded Zombie engineering, and specialist combat roles.

Optional local Ollama integration is disabled by default. When explicitly enabled,
active AI may bias bounded high-level task demand but does not directly control
per-tick movement, attacks, paths, or block coordinates.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"


[[dependencies.${mod_id}]]
modId="cloth_config"
type="required"
reason="Swarm Mobs uses Cloth Config for the client-side Command Center UI."
versionRange="[15.0.140,16)"
ordering="AFTER"
side="CLIENT"
