poll_interval_seconds: 5

coordination:
  branch: coordination
  messages_path: messages
  append_only: true
  require_peer_review_before_work: true

agents:
  chatgpt:
    surface: desktop
    app_name: ChatGPT
    work_branch: agent/chatgpt
    peer_branch: agent/cursor

  cursor:
    surface: web
    work_branch: agent/cursor
    peer_branch: agent/chatgpt

integration:
  protected_branch: main
  agents_may_write_main: false
  auto_merge: false
