checkpoint_seconds: 600
stable_output_seconds: 4
poll_interval_seconds: 1
max_rounds: 12

agents:
  chatgpt:
    kind: desktop
    app_name: ChatGPT
    role: developer_a
    branch: agent/gpt
    enter_to_send: true
    read_strategy: webarea

  claude:
    kind: desktop
    app_name: Claude
    role: developer_b
    branch: agent/claude
    enter_to_send: true
    read_strategy: clipboard

  deepseek:
    kind: browser
    app_name: Google Chrome
    role: consultant
    # Keep one dedicated DeepSeek window/profile open.
    window_title_contains: DeepSeek
    enter_to_send: true
    read_strategy: ax_tree

safety:
  blocked_fragments:
    - "git push --force"
    - "git push -f"
    - "git reset --hard"
    - "rm -rf"
    - "git checkout -- ."
    - "git clean -fd"
    - "git branch -D"
    - "git merge main"
