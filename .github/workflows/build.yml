name: Swarm Mobs Build

on:
  push:
    branches: [main, swarm-combat-v0.1, swarm-core-v0.2, heterogeneous-swarm-v0.3, heterogeneous-swarm-v0.3.1, heterogeneous-swarm-v0.3.2]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swarm-mobs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile
        run: gradle compileJava --stacktrace --warning-mode all
      - name: Unit tests
        run: gradle test --stacktrace
      - name: Runtime GameTests
        if: github.ref == 'refs/heads/swarm-combat-v0.1' || github.ref == 'refs/heads/swarm-core-v0.2' || github.ref == 'refs/heads/heterogeneous-swarm-v0.3' || github.ref == 'refs/heads/heterogeneous-swarm-v0.3.1' || github.ref == 'refs/heads/heterogeneous-swarm-v0.3.2'
        run: timeout 8m gradle runGameTestServer --no-daemon --stacktrace --warning-mode all
      - name: Build
        run: gradle build --stacktrace --warning-mode all
      - name: Upload jar
        uses: actions/upload-artifact@v6
        with:
          name: swarm-mobs-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
